<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="{{base}}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAAM — a gallery held together</title>
    <meta name="description" content="SAAM is a Cape Town gallery of six artists sharing one wall. Every work hangs in the physical gallery and is available to acquire or enquire after.">
    <meta name="robots" content="index, follow">

    <meta property="og:type" content="website">
    <meta property="og:title" content="SAAM — a gallery held together">
    <meta property="og:description" content="Six artists, one room. Cape Town, est. 2019.">

    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700|instrument-serif:400,400i">

    <style>
        /*{{layout-css}}*/
    </style>
</head>
<body>

    <header class="site-header" id="site-header"></header>

    <main>
        <div id="gallery"></div>
        <div id="artist"></div>
        <div id="studio"></div>
    </main>

    <footer class="site-footer">
        <div class="site-footer__grid">
            <div class="site-footer__brand">
                <div class="brand" onclick="goHome()">
                    <span id="footer-mark"></span>
                    <span class="brand__word">SAAM</span>
                </div>
                <p class="site-footer__line">Six artists, one room. A gallery held together.</p>
            </div>
            <div>
                <p class="site-footer__head">Visit</p>
                <p>41 Buiten Street<br>Cape Town</p>
                <p>Wed&ndash;Sat, 10&ndash;17h</p>
            </div>
            <div>
                <p class="site-footer__head">Contact</p>
                <p><a href="mailto:hello@saam.gallery">hello@saam.gallery</a></p>
                <p>Shipped worldwide, crated and insured.</p>
            </div>
            <div>
                <p class="site-footer__head">Explore</p>
                <p><span class="site-footer__link" onclick="goHome()">Artists</span></p>
                <p><span class="site-footer__link" onclick="scrollAbout()">About</span></p>
                <p><span class="site-footer__link" onclick="openCart()">Your collection</span></p>
            </div>
        </div>
        <div class="site-footer__bottom">
            <span>&copy; 2026 SAAM Gallery, Cape Town</span>
            <a class="btn btn--light" href="studio" onclick="return follow(event, openStudio)">Artist log in</a>
        </div>
    </footer>

    <div id="lightbox"></div>
    <div id="cart"></div>
    <div id="enquiry"></div>

    <script>
        // {{layout-js}}
    </script>
</body>
</html>
